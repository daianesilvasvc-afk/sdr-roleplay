<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Simulações — SDR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d0d0d; color: #e8e8e8;
    min-height: 100vh; padding: 2rem 1rem;
    display: flex; flex-direction: column; align-items: center;
  }
  #app { width: 100%; max-width: 900px; }
  .title { font-size: 22px; font-weight: 500; color: #fff; margin-bottom: 4px; }
  .sub { font-size: 14px; color: #666; margin-bottom: 1.5rem; }

  .filters { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
  .filters select, .filters button {
    padding: 8px 12px; font-size: 13px; border-radius: 8px;
    border: 1px solid #2a2a2a; background: #1a1a1a; color: #e8e8e8; font-family: inherit; cursor: pointer;
  }
  .filters button:hover { background: #222; }

  .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .sum-card { background: #1a1a1a; border: 0.5px solid #2a2a2a; border-radius: 10px; padding: 0.9rem 1rem; }
  .sum-card .lbl { font-size: 12px; color: #888; margin-bottom: 4px; }
  .sum-card .val { font-size: 22px; font-weight: 500; color: #fff; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; color: #888; font-weight: 500;
    border-bottom: 1px solid #2a2a2a; white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 0.5px solid #1e1e1e; color: #ddd; }
  tbody tr:hover { background: #151515; }
  .lvl-facil { color: #5cb85c; }
  .lvl-medio { color: #f5c518; }
  .lvl-dificil { color: #f87171; }
  .score { font-weight: 600; }
  .score-good { color: #5cb85c; }
  .score-mid { color: #f5c518; }
  .score-low { color: #f87171; }

  #por-etapa { margin-bottom: 1.5rem; }
  .etapas-titulo { font-size: 13px; color: #888; margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .etapas-pior { font-size: 12px; color: #f87171; }
  .etapas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .etapa-card { background: #141414; border: 0.5px solid #222; border-radius: 10px; padding: 0.7rem 0.85rem; }
  .etapa-card.etapa-pior { border-color: #5a2a2a; }
  .etapa-card .lbl { font-size: 11px; color: #777; margin-bottom: 3px; }
  .etapa-card .val { font-size: 20px; font-weight: 500; }
  .etapa-card .denom { font-size: 12px; color: #555; }

  #empty, #loading { color: #666; font-size: 14px; padding: 2rem 0; text-align: center; }
  #table-wrap { overflow-x: auto; background: #111; border: 0.5px solid #222; border-radius: 12px; padding: 0.5rem; }

  .veredicto { font-style: italic; color: #999; max-width: 320px; }
</style>
</head>
<body>
<div id="app">
  <div class="title">Histórico de Simulações — SDR</div>
  <div class="sub">Régua v4.1 (NEPQ + BANT) — critérios de 0 a 5 e % de script seguido.</div>

  <div class="filters">
    <select id="sdr-filter" onchange="applyFilter()">
      <option value="">Todos os SDRs</option>
    </select>
    <button onclick="load()">↻ Atualizar</button>
  </div>

  <div class="summary-cards" id="summary"></div>
  <div id="por-etapa" style="display:none"></div>

  <div id="loading">Carregando...</div>
  <div id="empty" style="display:none">Nenhuma simulação registrada ainda.</div>
  <div id="table-wrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>SDR</th>
          <th>Persona</th>
          <th>Nível</th>
          <th title="Investigação: clareza da dor">Inv.</th>
          <th title="Descoberta do sonho">Sonho</th>
          <th title="Solução: interesse na dor real">Sol.</th>
          <th title="Agendamento: escassez e valor">Agend.</th>
          <th>Critérios</th>
          <th>Script</th>
          <th>BANT</th>
          <th>Síntese do líder</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = "https://withered-wildflower-db78.daiane-silvasvc.workers.dev";
let allResults = [];

function fmtDate(s) {
  if (!s) return "—";
  const d = new Date(s.replace(" ", "T") + "Z");
  return d.toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
}

// Duas escalas diferentes no mesmo painel — cada uma com seu proprio corte.
function classeCriterios(v) {
  return v >= 4 ? "score-good" : v >= 3 ? "score-mid" : "score-low";
}
function classeScript(v) {
  return v >= 80 ? "score-good" : v >= 50 ? "score-mid" : "score-low";
}
function classeBant(v) {
  return v >= 3 ? "score-good" : v >= 2 ? "score-mid" : "score-low";
}
function media(rows, campo) {
  const v = rows.map(r => r[campo]).filter(n => typeof n === "number");
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const ETAPAS = ["investigacao", "sonho", "solucao", "agendamento"];

// A nota por etapa vem dentro da avaliacao completa, nao em coluna propria.
// "NA" (etapa nao alcancada) nao e zero e nao entra em media nenhuma.
function notaEtapa(r, etapa) {
  const c = r.criterios && r.criterios.criterios && r.criterios.criterios[etapa];
  if (!c) return null;
  if (c.nota === "NA" || c.nota === "na") return "NA";
  const n = Number(c.nota);
  return Number.isFinite(n) ? n : null;
}
function celulaEtapa(r, etapa) {
  const n = notaEtapa(r, etapa);
  if (n === null) return '<td style="color:#555">—</td>';
  if (n === "NA") return '<td style="color:#666">NA</td>';
  return `<td class="score ${classeCriterios(n)}">${n}</td>`;
}
// Media da etapa no conjunto filtrado — mostra em qual etapa o time todo trava.
function mediaEtapa(rows, etapa) {
  const v = rows.map(r => notaEtapa(r, etapa)).filter(n => typeof n === "number");
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

async function load() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("table-wrap").style.display = "none";
  document.getElementById("empty").style.display = "none";
  try {
    const resp = await fetch(API_URL + "/history?limit=500");
    const data = await resp.json();
    allResults = data.results || [];
    populateSdrFilter();
    applyFilter();
  } catch (e) {
    document.getElementById("loading").textContent = "Erro ao carregar: " + e.message;
  }
}

function populateSdrFilter() {
  const sel = document.getElementById("sdr-filter");
  const current = sel.value;
  const names = [...new Set(allResults.map(r => r.sdr_name))].sort();
  sel.innerHTML = '<option value="">Todos os SDRs</option>' +
    names.map(n => `<option value="${n}">${n}</option>`).join("");
  sel.value = current;
}

function applyFilter() {
  const filter = document.getElementById("sdr-filter").value;
  const rows = filter ? allResults.filter(r => r.sdr_name === filter) : allResults;
  render(rows);
}

function render(rows) {
  document.getElementById("loading").style.display = "none";

  // Resumo
  const summary = document.getElementById("summary");
  if (!rows.length) {
    summary.innerHTML = "";
    document.getElementById("empty").style.display = "block";
    document.getElementById("table-wrap").style.display = "none";
    return;
  }
  const mCrit = media(rows, "media_criterios");
  const mScript = media(rows, "script_pct");
  const mBant = media(rows, "bant_score");
  const bySdr = new Set(rows.map(r => r.sdr_name)).size;
  const card = (lbl, val, cls) =>
    `<div class="sum-card"><div class="lbl">${lbl}</div><div class="val ${cls}">${val}</div></div>`;
  summary.innerHTML =
    card("Simulações", rows.length, "") +
    card("Média critérios", mCrit === null ? "—" : mCrit.toFixed(1) + "/5", mCrit === null ? "" : classeCriterios(mCrit)) +
    card("Script médio", mScript === null ? "—" : Math.round(mScript) + "%", mScript === null ? "" : classeScript(mScript)) +
    card("BANT médio", mBant === null ? "—" : mBant.toFixed(1) + "/4", mBant === null ? "" : classeBant(mBant)) +
    card("SDRs ativos", bySdr, "");

  // Onde o time trava: media de cada etapa no conjunto filtrado.
  const ROTULOS = { investigacao:"Investigação", sonho:"Sonho", solucao:"Solução", agendamento:"Agendamento" };
  const porEtapa = ETAPAS.map(e => ({ e, m: mediaEtapa(rows, e) })).filter(x => x.m !== null);
  const etapasEl = document.getElementById("por-etapa");
  if (porEtapa.length) {
    // Empate e comum com poucas simulacoes — apontar so a primeira esconderia
    // as outras etapas igualmente fracas, que e justamente o que se age em cima.
    const minimo = Math.min(...porEtapa.map(x => x.m));
    const piores = porEtapa.filter(x => x.m === minimo).map(x => x.e);
    const rotuloPior = piores.map(e => ROTULOS[e]).join(", ");
    etapasEl.innerHTML =
      '<div class="etapas-titulo">Média por etapa' +
      `<span class="etapas-pior">ponto${piores.length > 1 ? "s" : ""} mais fraco${piores.length > 1 ? "s" : ""}: ${rotuloPior}</span></div>` +
      '<div class="etapas-grid">' +
      porEtapa.map(({ e, m }) =>
        `<div class="etapa-card${piores.includes(e) ? " etapa-pior" : ""}">` +
          `<div class="lbl">${ROTULOS[e]}</div>` +
          `<div class="val ${classeCriterios(m)}">${m.toFixed(1)}<span class="denom">/5</span></div>` +
        '</div>').join("") +
      '</div>';
    etapasEl.style.display = "block";
  } else {
    etapasEl.style.display = "none";
  }

  document.getElementById("empty").style.display = "none";
  document.getElementById("table-wrap").style.display = "block";
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${fmtDate(r.created_at)}</td>
      <td>${esc(r.sdr_name) || "—"}</td>
      <td>${esc(r.persona_name) || "—"}${r.persona_shop ? " · " + esc(r.persona_shop) : ""}</td>
      <td class="lvl-${esc(r.level) || ''}">${esc(r.level) || "—"}</td>
      ${ETAPAS.map(e => celulaEtapa(r, e)).join("")}
      <td class="score ${typeof r.media_criterios === "number" ? classeCriterios(r.media_criterios) : ""}">${typeof r.media_criterios === "number" ? r.media_criterios.toFixed(1) + "/5" : "—"}</td>
      <td class="score ${typeof r.script_pct === "number" ? classeScript(r.script_pct) : ""}">${typeof r.script_pct === "number" ? r.script_pct + "%" : "—"}</td>
      <td class="score ${typeof r.bant_score === "number" ? classeBant(r.bant_score) : ""}">${typeof r.bant_score === "number" ? r.bant_score + "/4" : "—"}</td>
      <td class="veredicto">${esc(r.veredicto)}</td>
    </tr>
  `).join("");
}

load();
</script>
</body>
</html>
